name: android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'editor/**'
      - 'gradle/**'
      - 'crates/**'
      - 'scripts/**'
      - 'rust-toolchain.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.editorconfig'
      - '.github/workflows/android.yml'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rust Android toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Generate UniFFI bindings + native libraries
        run: |
          cargo install cargo-ndk
          cargo install uniffi_bindgen --version 0.32.0
          scripts/build-ffi.sh

      - name: Format check
        run: gradle ktlintCheck --no-daemon
      - name: Unit tests + lint + assemble
        run: gradle :editor:testDebugUnitTest :app:lintDebug :editor:lintDebug :app:assembleDebug --no-daemon